<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aplicar libros</title>
  <meta name="description" content="Aplica y recuerda lo que aprendes en los libros.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <!-- iPhone: permite instalarla en la pantalla de inicio como una app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aplicar libros">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main id="pantalla"></main>

  <nav class="pestanas">
    <button data-pestana="hoy" class="activa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button data-pestana="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progreso</button>
    <button data-pestana="citas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h4v4c0 3-2 5-4 5"/><path d="M15 7h4v4c0 3-2 5-4 5"/></svg>Citas</button>
    <button data-pestana="libros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5v-2z"/><path d="M8 7h7"/></svg>Libros</button>
  </nav>

  <dialog id="hoja"><div id="hoja-contenido"></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <!-- Contenido: un archivo por libro + citas -->
  <script src="datos/carnegie.js"></script>
  <script src="datos/citas.js"></script>
  <!-- Lógica de la app -->
  <script src="app/almacen.js"></script>
  <script src="app/futuro.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
